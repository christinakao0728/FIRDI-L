<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRDI-L 食材進貨視覺化儀表板</title>
    <!-- CSS: Bootstrap 5, DataTables, FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #4e73df; --success-color: #1cc88a; --info-color: #36b9cc; --warning-color: #f6c23e; }
        body { background-color: #f4f7fc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dashboard-container { padding: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); margin-bottom: 20px; }
        .card-header { background-color: #f8f9fc; border-bottom: 1px solid #e3e6f0; font-weight: bold; color: #4e73df; }
        .stat-card { border-left: 0.25rem solid; }
        .stat-card-primary { border-left-color: var(--primary-color); }
        .stat-card-success { border-left-color: var(--success-color); }
        .stat-card-info { border-left-color: var(--info-color); }
        .stat-title { font-size: 0.7rem; font-weight: bold; color: #4e73df; text-transform: uppercase; margin-bottom: 0.25rem; }
        .stat-value { font-size: 1.25rem; font-weight: bold; color: #5a5c69; }
        .icon-box { color: #dddfeb; font-size: 2rem; }
        .chart-container { position: relative; height: 400px; display: flex; align-items: center; justify-content: center; }
        
        /* 真實比例台灣地圖樣式 */
        #taiwan-map { height: 100%; width: auto; max-width: 100%; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1)); }
        .region { fill: #e0e0e0; stroke: #fff; stroke-width: 1; transition: all 0.3s; cursor: pointer; }
        .region:hover { fill: #b0b0b0 !important; transform: scale(1.02); transform-origin: center; }
        .active-north { fill: #4e73df !important; }
        .active-central { fill: #1cc88a !important; }
        .active-south { fill: #36b9cc !important; }
        .active-east { fill: #f6c23e !important; }
        
        .map-legend { font-size: 0.8rem; margin-top: 15px; }
        .legend-item { display: flex; align-items: center; margin-right: 15px; margin-bottom: 5px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="dashboard-container">

    </div>

    <!-- 統計卡片 -->
    <div class="row">
        <div class="col-xl-3 col-md-6 mb-4">

                            <div class="stat-title">進貨總項目</div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card stat-card stat-card-success h-100 py-2">
                <div class="card-body">
                    <div class="row no-gutters align-items-center">
                        <div class="col mr-2">
                            <div class="stat-title">涵蓋產地區域</div>
                            <div class="stat-value" id="totalOrigins">0</div>
                        </div>
                        <div class="col-auto icon-box"><i class="fas fa-map-marked-alt"></i></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">

                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6 mb-4">

                    <div class="row no-gutters align-items-center">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 台灣地圖區域 -->
        <div class="col-lg-5">
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex justify-content-between align-items-center">
                    <h6 class="m-0 font-weight-bold">台灣產地分佈輪廓</h6>
                    <small class="text-muted" id="map-info">點擊區域進行篩選</small>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <svg id="taiwan-map" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
                            <path id="path-north" class="region" d="M280,10 L310,20 L330,40 L340,70 L330,110 L290,140 L240,130 L220,90 L230,40 Z" />
                            <path id="path-central" class="region" d="M240,130 L290,140 L280,190 L260,250 L180,240 L160,200 L180,140 Z" />
                            <path id="path-south" class="region" d="M180,240 L260,250 L240,320 L210,420 L180,480 L140,450 L120,380 L130,280 Z" />
                            <path id="path-east" class="region" d="M290,140 L330,110 L350,180 L320,350 L280,420 L210,420 L240,320 L260,250 L280,190 Z" />
                            <text x="275" y="70" font-size="16" font-weight="bold" fill="#333" pointer-events="none">北區</text>
                            <text x="210" y="185" font-size="16" font-weight="bold" fill="#333" pointer-events="none">中區</text>
                            <text x="160" y="360" font-size="16" font-weight="bold" fill="#333" pointer-events="none">南區</text>
                            <text x="285" y="280" font-size="16" font-weight="bold" fill="#333" pointer-events="none">東區</text>
                        </svg>
                    </div>
                    <div class="d-flex justify-content-center map-legend flex-wrap">
                        <div class="legend-item"><div class="legend-color" style="background: #4e73df;"></div>北區: <span id="count-north">0</span></div>
                        <div class="legend-item"><div class="legend-color" style="background: #1cc88a;"></div>中區: <span id="count-central">0</span></div>
                        <div class="legend-item"><div class="legend-color" style="background: #36b9cc;"></div>南區: <span id="count-south">0</span></div>
                        <div class="legend-item"><div class="legend-color" style="background: #f6c23e;"></div>東區: <span id="count-east">0</span></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 食材分佈區域：更換為 Polar Area Chart -->
        <div class="col-lg-7">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold">食材供應佔比動態分析 (Polar Area)</h6>
                </div>
                <div class="card-body">
                    <div class="chart-container" style="height: 400px;">
                        <canvas id="ingredientPolarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 表格 -->

        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold">進貨明細清單</h6>
        </div>
        <div class="card-body">
            <div class="table-responsive">

                        <tr><th>批號</th><th>食材</th><th>產地</th><th>供應商</th><th>進貨日期</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>

            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>

    // 品類顏色映射
    const ingredientColors = {
        '菇類': '#8d6e63', '雞蛋': '#fdd835', '高麗菜': '#66bb6a', '洋蔥': '#ffee58',
        '紅蘿蔔': '#ff7043', '麵粉': '#bdbdbd', '白米': '#e0e0e0', '馬鈴薯': '#a1887f',
        '起司': '#ffd54f', '食用油': '#ffb300', '醬油': '#3e2723', '豆腐': '#f5f5f5',
        '番茄': '#ef5350', '鮭魚': '#ffa726', '蝦仁': '#ff8a65', '豬絞肉': '#f48fb1',
        '牛奶': '#e1f5fe', '砂糖': '#f3e5f5', '雞胸肉': '#ffccbc'
    };

    $(document).ready(function() {
        const rows = csvData.trim().split('\n').slice(1);
        let tableHtml = "";
        let origins = { "北區": 0, "中區": 0, "南區": 0, "東區": 0 };
        let ingredients = {};
        let suppliers = {};

        rows.forEach(row => {
            const cols = row.split(',');
            tableHtml += `<tr>${cols.map(c => `<td>${c}</td>`).join('')}</tr>`;
            if(origins.hasOwnProperty(cols[2])) origins[cols[2]]++;
            ingredients[cols[1]] = (ingredients[cols[1]] || 0) + 1;
            suppliers[cols[3]] = (suppliers[cols[3]] || 0) + 1;
        });

        $('#tableBody').html(tableHtml);
        $('#totalItems').text(rows.length);
        $('#totalOrigins').text(Object.values(origins).filter(v => v > 0).length);
        $('#totalIngredients').text(Object.keys(ingredients).length);
        let topSup = Object.keys(suppliers).reduce((a, b) => suppliers[a] > suppliers[b] ? a : b);
        $('#topSupplier').text(topSup);

        $('#count-north').text(origins["北區"]);
        $('#count-central').text(origins["中區"]);
        $('#count-south').text(origins["南區"]);
        $('#count-east').text(origins["東區"]);

        if(origins["北區"] > 0) $('#path-north').addClass('active-north');
        if(origins["中區"] > 0) $('#path-central').addClass('active-central');
        if(origins["南區"] > 0) $('#path-south').addClass('active-south');
        if(origins["東區"] > 0) $('#path-east').addClass('active-east');

        const table = $('#dataTable').DataTable({
            "language": { "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/zh-HANT.json" },
            "pageLength": 10
        });

        $('.region').click(function() {
            const regionId = $(this).attr('id').replace('path-', '');
            const regionMap = { 'north': '北區', 'central': '中區', 'south': '南區', 'east': '東區' };
            const regionName = regionMap[regionId];
            table.column(2).search(regionName).draw();
            $('#map-info').html(`<span class="badge bg-info">已篩選: ${regionName}</span> <a href="#" id="clear-filter" class="ms-2">清除</a>`);
        });

        $(document).on('click', '#clear-filter', function(e) {
            e.preventDefault();
            table.column(2).search('').draw();
            $('#map-info').text('點擊區域進行篩選');
        });

        // 繪製食材 Polar Area Chart (依據品類區分顏色)
        const sortedIng = Object.entries(ingredients).sort((a,b) => b[1] - a[1]).slice(0, 10);
        const labels = sortedIng.map(x => x[0]);
        const data = sortedIng.map(x => x[1]);
        const backgroundColors = labels.map(name => ingredientColors[name] || '#4e73df');

        new Chart(document.getElementById('ingredientPolarChart'), {
            type: 'polarArea',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: backgroundColors,
                    borderWidth: 1
                }]
            },
            options: { 
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ` ${context.label}: 進貨 ${context.raw} 次`;
                            }
                        }
                    }
                },
                scales: {
                    r: { ticks: { display: false } }
                }
            }
        });
    });
</script>
